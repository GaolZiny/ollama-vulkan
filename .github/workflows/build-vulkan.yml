name: Build Ollama Vulkan (Manual)

# Build any ollama/ollama ref (branch, tag or SHA) on demand.
# Pushes :<ref> only; :latest is left to the auto workflow (releases only).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ollama/ollama ref (branch / tag / SHA)'
        type: string
        default: main

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        env:
          REF: ${{ inputs.ref }}
        run: |
          # Docker tags allow [A-Za-z0-9_.-]
          TAG=$(echo "$REF" | sed 's|[^A-Za-z0-9_.-]|-|g')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/vulkan-image.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      tags: ${{ needs.prepare.outputs.tag }}
