name: Build Ollama Vulkan (Auto)

# Daily: if ollama/ollama has a new release that is not yet in GHCR,
# build it as a Vulkan-only image and push :<tag> and :latest.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建 (rebuild even if the tag already exists)'
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      tag: ${{ steps.latest.outputs.tag }}
      version: ${{ steps.latest.outputs.version }}
    steps:
      - name: Get latest ollama release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/ollama/ollama/releases/latest --jq '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Failed to get latest ollama release"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Latest ollama release: $TAG"

      - name: Compare with GHCR
        id: compare
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          FORCE: ${{ github.event.inputs.force_build }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${GITHUB_REPOSITORY_OWNER,,}/ollama-vulkan"
          # GHCR accepts the base64-encoded GITHUB_TOKEN as a bearer token.
          TAGS=$(curl -sf -H "Authorization: Bearer $(echo -n "$TOKEN" | base64 -w0)" \
            "https://ghcr.io/v2/${REPO}/tags/list?n=1000" | jq -r '.tags[]?' || true)
          if [ "$FORCE" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"; echo "✅ 强制构建 $TAG"
          elif echo "$TAGS" | grep -qx "$TAG"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"; echo "⏭️  $TAG 已存在，跳过"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"; echo "✅ 需要构建 $TAG"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/vulkan-image.yml
    with:
      ref: ${{ needs.check-version.outputs.tag }}
      version: ${{ needs.check-version.outputs.version }}
      tags: |
        ${{ needs.check-version.outputs.tag }}
        latest
