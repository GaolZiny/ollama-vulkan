name: Vulkan image (reusable)

# Shared build job used by build-vulkan.yml and "Auto build Vulkan docker image.yaml".
# Checks out ollama/ollama at the given ref, patches its Dockerfile with
# .github/vulkan/patch_dockerfile.py (CPU + Vulkan only) and pushes to GHCR.

on:
  workflow_call:
    inputs:
      ref:
        description: ollama/ollama git ref to build (tag, branch or SHA)
        type: string
        required: true
      version:
        description: Version string baked into the binary (e.g. 0.40.16)
        type: string
        required: true
      tags:
        description: Image tags to push, one per line (without the image name)
        type: string
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -af --volumes
          df -h /

      - name: Checkout ollama/ollama
        uses: actions/checkout@v4
        with:
          repository: ollama/ollama
          ref: ${{ inputs.ref }}

      - name: Checkout patch script
        uses: actions/checkout@v4
        with:
          path: .vulkan-fork
          sparse-checkout: .github/vulkan

      - name: Patch Dockerfile (Vulkan only)
        run: |
          python3 .vulkan-fork/.github/vulkan/patch_dockerfile.py Dockerfile
          rm -rf .vulkan-fork
          git diff --stat Dockerfile

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/ollama-vulkan" >> "$GITHUB_ENV"

      - name: Image tags
        id: tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          {
            echo 'list<<EOF'
            echo "$TAGS" | sed '/^\s*$/d' | sed "s|^|${IMAGE}:|"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        timeout-minutes: 300
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            GOFLAGS='-ldflags=-w -s "-X=github.com/ollama/ollama/version.Version=${{ inputs.version }}" "-X=github.com/ollama/ollama/server.mode=release"'
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          REF="${IMAGE}:$(echo '${{ inputs.tags }}' | sed '/^\s*$/d' | head -1)"
          VERSION=$(docker run --rm --entrypoint /bin/ollama "$REF" --version 2>&1 || true)
          echo "$VERSION"
          docker run --rm --entrypoint /bin/sh "$REF" -c 'ls /usr/lib/ollama/vulkan' | grep -q 'libggml-vulkan' \
            || { echo "::error::Vulkan backend missing from image"; exit 1; }
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Build complete
          - **ollama ref**: \`${{ inputs.ref }}\`
          - **Expected version**: \`${{ inputs.version }}\`
          - **\`ollama --version\`**: \`${VERSION}\`
          - **Image**: \`${REF}\`
          EOF
